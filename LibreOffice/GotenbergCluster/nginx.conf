error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format conversion '$remote_addr "$request" status=$status '
                          'upstream=$upstream_addr upstream_status=$upstream_status '
                          'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout conversion;

    # Docker DNS; refresh upstream addresses when containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream gotenberg_pool {
        zone gotenberg_pool 64k;
        least_conn;
        
        server gotenberg:3000 resolve max_conns=1 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 3000;
        server_name _;
        client_max_body_size 100m;
        client_body_timeout 150s;
        send_timeout 150s;

        # nginx liveness only; not Gotenberg readiness or free capacity.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gotenberg_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering on;
            proxy_ignore_client_abort on;
            proxy_buffering off;
            # Keep upstream running when the client disconnects.
            # Upstream timeouts or nginx restarts can still release the slot.
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Never replay a conversion POST against another container.
            proxy_next_upstream off;
        }
    }
}
