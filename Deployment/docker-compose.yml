services:
  redis: 
    image: redis:7.4-alpine3.21
    container_name: redis-server
    restart: always
    env_file:
      - Env/.env.redis
    volumes:
      - redis_data:/data
    command:
    - sh
    - -c
    - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=180s"
      - "--libreoffice-restart-after=1"
    deploy:
      replicas: 20
      resources:
        limits:
          cpus: 0.25
          memory: 512m
        
  app:
    image: duongthuan0405/file-converter:v1
    env_file:
      - ./Env/.env.app
    ports:
      - 80:8080
    depends_on:
      - redis
      - nginx
    volumes:
      - app_storage:/app/Storage
      - app_logs:/app/Logs
    
  
volumes:
  redis_data:
  redisinsight_data:
  app_storage:
  app_logs:
